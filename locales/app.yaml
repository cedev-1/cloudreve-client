credentialExpiredMessage:
  en-US: "The authorization for drive \"%{drive}\" has expired. Please re-authorize to continue syncing."
  zh-CN: "云盘 \"%{drive}\" 的授权已过期，请重新授权以继续同步。"
  zh-TW: "雲端硬碟「%{drive}」的授權已過期，請重新授權以繼續同步。"
  ja: "ドライブ「%{drive}」の認証が期限切れになりました。同期を続けるには再認証してください。"
  de: "Die Autorisierung für Laufwerk \"%{drive}\" ist abgelaufen. Bitte autorisieren Sie erneut, um die Synchronisierung fortzusetzen."
  fr: "L'autorisation pour le disque « %{drive} » a expiré. Veuillez réautoriser pour continuer la synchronisation."
  es: "La autorización para la unidad \"%{drive}\" ha expirado. Por favor, vuelva a autorizar para continuar la sincronización."
  ko: "드라이브 \"%{drive}\"의 인증이 만료되었습니다. 동기화를 계속하려면 다시 인증해 주세요."
  ru: "Срок авторизации для диска «%{drive}» истёк. Пожалуйста, повторите авторизацию для продолжения синхронизации."
  pl: \"Autoryzacja dla dysku „%{drive}\" wygasła. Proszę ponownie autoryzować, aby kontynuować synchronizację."
  it: "L'autorizzazione per l'unità \"%{drive}\" è scaduta. Si prega di riautorizzare per continuare la sincronizzazione."
userIdMismatch:
  en-US: "The account used for reauthorization does not match the original drive owner. Please sign in with the same account."
  zh-CN: "重新授权使用的账户与原云盘所有者不一致，请使用相同账户登录。"
  zh-TW: "重新授權使用的帳戶與原雲端硬碟擁有者不一致，請使用相同帳戶登入。"
  ja: "再認証に使用されたアカウントは元のドライブ所有者と一致しません。同じアカウントでサインインしてください。"
  de: "Das für die erneute Autorisierung verwendete Konto stimmt nicht mit dem ursprünglichen Laufwerksbesitzer überein. Bitte melden Sie sich mit demselben Konto an."
  fr: "Le compte utilisé pour la réautorisation ne correspond pas au propriétaire d'origine du disque. Veuillez vous connecter avec le même compte."
  es: "La cuenta utilizada para la reautorización no coincide con el propietario original de la unidad. Por favor, inicie sesión con la misma cuenta."
  ko: "재인증에 사용된 계정이 원래 드라이브 소유자와 일치하지 않습니다. 동일한 계정으로 로그인해 주세요."
  ru: "Аккаунт, использованный для повторной авторизации, не соответствует исходному владельцу диска. Пожалуйста, войдите с тем же аккаунтом."
  pl: "Konto użyte do ponownej autoryzacji nie odpowiada pierwotnemu właścicielowi dysku. Proszę zalogować się tym samym kontem."
  it: "L'account utilizzato per la riautorizzazione non corrisponde al proprietario originale dell'unità. Effettua l'accesso con lo stesso account."
