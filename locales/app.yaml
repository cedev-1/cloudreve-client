syncPathOverlapsDrive:
  en-US: "%{folder} cannot be used: it overlaps the folder of the drive \"%{drive}\" (%{other}). Two drives cannot share a folder or sit inside each other. Choose another folder."
  zh-CN: "无法使用 %{folder}：它与驱动器“%{drive}”的文件夹（%{other}）重叠。两个驱动器不能共用文件夹，也不能互相嵌套。请选择其他文件夹。"
  zh-TW: "無法使用 %{folder}：它與磁碟機「%{drive}」的資料夾（%{other}）重疊。兩個磁碟機不能共用資料夾，也不能互相巢狀。請選擇其他資料夾。"
  ja: "%{folder} は使用できません：ドライブ「%{drive}」のフォルダー（%{other}）と重なっています。2 つのドライブでフォルダーを共有したり、入れ子にしたりすることはできません。別のフォルダーを選択してください。"
  de: "%{folder} kann nicht verwendet werden: Der Ordner überschneidet sich mit dem Ordner des Laufwerks „%{drive}“ (%{other}). Zwei Laufwerke dürfen keinen Ordner teilen oder ineinander liegen. Wählen Sie einen anderen Ordner."
  fr: "%{folder} ne peut pas être utilisé : il chevauche le dossier du lecteur « %{drive} » (%{other}). Deux lecteurs ne peuvent pas partager un dossier ni être l'un dans l'autre. Choisissez un autre dossier."
  es: "No se puede usar %{folder}: se superpone con la carpeta de la unidad «%{drive}» (%{other}). Dos unidades no pueden compartir una carpeta ni estar una dentro de otra. Elija otra carpeta."
  ko: "%{folder}을(를) 사용할 수 없습니다: 드라이브 \"%{drive}\"의 폴더(%{other})와 겹칩니다. 두 드라이브는 폴더를 공유하거나 서로 안에 있을 수 없습니다. 다른 폴더를 선택하세요."
  ru: "Нельзя использовать %{folder}: папка пересекается с папкой диска «%{drive}» (%{other}). Два диска не могут использовать одну папку или находиться друг в друге. Выберите другую папку."
  pl: "Nie można użyć %{folder}: nakłada się na folder dysku „%{drive}” (%{other}). Dwa dyski nie mogą współdzielić folderu ani być zagnieżdżone. Wybierz inny folder."
  it: "Impossibile usare %{folder}: si sovrappone alla cartella dell'unità «%{drive}» (%{other}). Due unità non possono condividere una cartella né stare una dentro l'altra. Scegli un'altra cartella."
localPathCannotBeRootDrive:
  en-US: "The local path cannot be a root drive (e.g., E:\\). Please select a subfolder."
  zh-CN: "本地路径不能是根驱动器（如 E:\\）。请选择一个子文件夹。"
  zh-TW: "本機路徑不能是根磁碟機（如 E:\\）。請選擇子資料夾。"
  ja: "ローカルパスはルートドライブ（例：E:\\）にできません。サブフォルダを選択してください。"
  de: "Der lokale Pfad darf kein Stammlaufwerk sein (z.B. E:\\). Bitte wählen Sie einen Unterordner."
  fr: "Le chemin local ne peut pas être un lecteur racine (ex. : E:\\). Veuillez sélectionner un sous-dossier."
  es: "La ruta local no puede ser una unidad raíz (ej. E:\\). Por favor, seleccione una subcarpeta."
  ko: "로컬 경로는 루트 드라이브(예: E:\\)가 될 수 없습니다. 하위 폴더를 선택하세요."
  ru: "Локальный путь не может быть корневым диском (например, E:\\). Пожалуйста, выберите подпапку."
  pl: "Ścieżka lokalna nie może być dyskiem głównym (np. E:\\). Proszę wybrać podfolder."
  it: "Il percorso locale non può essere un'unità radice (es. E:\\). Seleziona una sottocartella."
limitedOnDemandCacheTitle:
  en-US: "Limited on-demand cache"
  zh-CN: "按需缓存容量受限"
  zh-TW: "按需快取容量受限"
  ja: "オンデマンドキャッシュの制限"
  de: "Eingeschränkter Bei-Bedarf-Cache"
  fr: "Cache à la demande limité"
  es: "Caché bajo demanda limitada"
  ko: "온디맨드 캐시 제한됨"
  ru: "Ограниченный кэш по требованию"
  pl: "Ograniczona pamięć podręczna na żądanie"
  it: "Cache su richiesta limitata"
limitedOnDemandCacheMessage:
  en-US: "%{drive}'s on-demand cache is limited to %{cap} because of low disk space."
  zh-CN: "由于磁盘空间不足，“%{drive}”的按需缓存已限制为 %{cap}。"
  zh-TW: "由於磁碟空間不足，「%{drive}」的按需快取已限制為 %{cap}。"
  ja: "ディスク容量が不足しているため、「%{drive}」のオンデマンドキャッシュは %{cap} に制限されています。"
  de: "Der Bei-Bedarf-Cache von \"%{drive}\" ist aufgrund von wenig Speicherplatz auf %{cap} begrenzt."
  fr: "Le cache à la demande de « %{drive} » est limité à %{cap} en raison d'un espace disque insuffisant."
  es: "La caché bajo demanda de \"%{drive}\" está limitada a %{cap} debido a espacio en disco insuficiente."
  ko: "디스크 공간이 부족하여 \"%{drive}\"의 온디맨드 캐시가 %{cap}(으)로 제한되었습니다."
  ru: "Кэш «%{drive}» по требованию ограничен до %{cap} из-за нехватки места на диске."
  pl: "Pamięć podręczna na żądanie dysku \"%{drive}\" jest ograniczona do %{cap} z powodu małej ilości miejsca na dysku."
  it: "La cache su richiesta di \"%{drive}\" è limitata a %{cap} a causa di spazio su disco insufficiente."
uploadFailedTitle:
  en-US: "Upload failed"
  zh-CN: "上传失败"
  zh-TW: "上傳失敗"
  ja: "アップロードに失敗しました"
  de: "Upload fehlgeschlagen"
  fr: "Échec du téléversement"
  es: "Error al subir"
  ko: "업로드 실패"
  ru: "Не удалось загрузить"
  pl: "Przesyłanie nie powiodło się"
  it: "Caricamento non riuscito"
uploadProblemQuota:
  en-US: "Your changes on %{drive} cannot be uploaded: the account's storage is full. Free up space on the server (or ask for more); they stay on this computer and upload once there is room."
  zh-CN: "%{drive} 上的更改无法上传：账户存储空间已满。请在服务器上释放空间（或申请更多空间）；更改会保留在本机，有空间后自动上传。"
  zh-TW: "%{drive} 上的變更無法上傳：帳戶儲存空間已滿。請在伺服器上釋放空間（或申請更多空間）；變更會保留在本機，有空間後自動上傳。"
  ja: "%{drive} の変更をアップロードできません：アカウントのストレージがいっぱいです。サーバーの空き容量を増やしてください（または容量の追加を依頼してください）。変更はこのコンピューターに保持され、空きができ次第アップロードされます。"
  de: "Ihre Änderungen auf %{drive} können nicht hochgeladen werden: Der Speicher des Kontos ist voll. Geben Sie auf dem Server Platz frei (oder fordern Sie mehr an); die Änderungen bleiben auf diesem Computer und werden hochgeladen, sobald wieder Platz ist."
  fr: "Vos modifications sur %{drive} ne peuvent pas être envoyées : l'espace de stockage du compte est plein. Libérez de la place sur le serveur (ou demandez-en plus) ; elles restent sur cet ordinateur et seront envoyées dès qu'il y aura de la place."
  es: "Sus cambios en %{drive} no se pueden subir: el almacenamiento de la cuenta está lleno. Libere espacio en el servidor (o solicite más); los cambios se quedan en este equipo y se subirán cuando haya espacio."
  ko: "%{drive}의 변경 사항을 업로드할 수 없습니다: 계정 저장 공간이 가득 찼습니다. 서버에서 공간을 확보하세요(또는 추가 공간을 요청하세요). 변경 사항은 이 컴퓨터에 보관되며 공간이 생기면 업로드됩니다."
  ru: "Изменения на %{drive} не удаётся отправить: хранилище аккаунта заполнено. Освободите место на сервере (или запросите больше); изменения остаются на этом компьютере и будут отправлены, как только появится место."
  pl: "Nie można wysłać zmian na %{drive}: miejsce na koncie jest pełne. Zwolnij miejsce na serwerze (lub poproś o więcej); zmiany pozostają na tym komputerze i zostaną wysłane, gdy będzie miejsce."
  it: "Le modifiche su %{drive} non possono essere caricate: lo spazio dell'account è pieno. Libera spazio sul server (o richiedine altro); restano su questo computer e verranno caricate appena ci sarà spazio."
uploadProblemTooLarge:
  en-US: "A file on %{drive} cannot be uploaded: it is larger than the server accepts. Make it smaller or keep it elsewhere; it stays on this computer until then."
  zh-CN: "%{drive} 上的一个文件无法上传：它超过了服务器允许的大小。请缩小文件或存放到其他位置；在此之前它会保留在本机。"
  zh-TW: "%{drive} 上的一個檔案無法上傳：它超過了伺服器允許的大小。請縮小檔案或存放到其他位置；在此之前它會保留在本機。"
  ja: "%{drive} のファイルをアップロードできません：サーバーが受け付けるサイズを超えています。ファイルを小さくするか別の場所に保存してください。それまではこのコンピューターに保持されます。"
  de: "Eine Datei auf %{drive} kann nicht hochgeladen werden: Sie ist größer, als der Server annimmt. Verkleinern Sie sie oder speichern Sie sie woanders; bis dahin bleibt sie auf diesem Computer."
  fr: "Un fichier sur %{drive} ne peut pas être envoyé : il dépasse la taille acceptée par le serveur. Réduisez-le ou rangez-le ailleurs ; il reste sur cet ordinateur en attendant."
  es: "Un archivo en %{drive} no se puede subir: es más grande de lo que acepta el servidor. Redúzcalo o guárdelo en otro lugar; hasta entonces se queda en este equipo."
  ko: "%{drive}의 파일을 업로드할 수 없습니다: 서버가 허용하는 크기보다 큽니다. 파일 크기를 줄이거나 다른 곳에 보관하세요. 그때까지 이 컴퓨터에 보관됩니다."
  ru: "Файл на %{drive} не удаётся отправить: он больше, чем принимает сервер. Уменьшите его или храните в другом месте; до тех пор он остаётся на этом компьютере."
  pl: "Nie można wysłać pliku na %{drive}: jest większy, niż akceptuje serwer. Zmniejsz go lub przechowuj gdzie indziej; do tego czasu pozostaje na tym komputerze."
  it: "Un file su %{drive} non può essere caricato: è più grande di quanto accetti il server. Riducilo o tienilo altrove; fino ad allora resta su questo computer."
uploadProblemPermission:
  en-US: "Your changes on %{drive} cannot be uploaded: the server does not allow writing there. Check your access rights with the server's administrator; the changes stay on this computer."
  zh-CN: "%{drive} 上的更改无法上传：服务器不允许在此处写入。请向服务器管理员确认您的访问权限；更改会保留在本机。"
  zh-TW: "%{drive} 上的變更無法上傳：伺服器不允許在此處寫入。請向伺服器管理員確認您的存取權限；變更會保留在本機。"
  ja: "%{drive} の変更をアップロードできません：サーバーがその場所への書き込みを許可していません。サーバー管理者にアクセス権を確認してください。変更はこのコンピューターに保持されます。"
  de: "Ihre Änderungen auf %{drive} können nicht hochgeladen werden: Der Server erlaubt dort kein Schreiben. Klären Sie Ihre Zugriffsrechte mit dem Administrator des Servers; die Änderungen bleiben auf diesem Computer."
  fr: "Vos modifications sur %{drive} ne peuvent pas être envoyées : le serveur n'autorise pas l'écriture à cet endroit. Vérifiez vos droits d'accès auprès de l'administrateur du serveur ; elles restent sur cet ordinateur."
  es: "Sus cambios en %{drive} no se pueden subir: el servidor no permite escribir ahí. Compruebe sus permisos con el administrador del servidor; los cambios se quedan en este equipo."
  ko: "%{drive}의 변경 사항을 업로드할 수 없습니다: 서버가 해당 위치에 쓰기를 허용하지 않습니다. 서버 관리자에게 접근 권한을 확인하세요. 변경 사항은 이 컴퓨터에 보관됩니다."
  ru: "Изменения на %{drive} не удаётся отправить: сервер не разрешает запись в это место. Уточните права доступа у администратора сервера; изменения остаются на этом компьютере."
  pl: "Nie można wysłać zmian na %{drive}: serwer nie pozwala tam zapisywać. Sprawdź swoje uprawnienia u administratora serwera; zmiany pozostają na tym komputerze."
  it: "Le modifiche su %{drive} non possono essere caricate: il server non consente la scrittura in quella posizione. Verifica i tuoi permessi con l'amministratore del server; restano su questo computer."
uploadProblemRepeated:
  en-US: "Your changes on %{drive} keep failing to upload. They stay on this computer and are retried automatically; if this lasts, check your connection and that the server is reachable."
  zh-CN: "%{drive} 上的更改多次上传失败。更改会保留在本机并自动重试；如果持续出现，请检查网络连接以及服务器是否可访问。"
  zh-TW: "%{drive} 上的變更多次上傳失敗。變更會保留在本機並自動重試；如果持續發生，請檢查網路連線以及伺服器是否可連線。"
  ja: "%{drive} の変更のアップロードが繰り返し失敗しています。変更はこのコンピューターに保持され、自動的に再試行されます。続く場合は接続とサーバーに到達できるかを確認してください。"
  de: "Das Hochladen Ihrer Änderungen auf %{drive} schlägt wiederholt fehl. Sie bleiben auf diesem Computer und werden automatisch erneut versucht; hält das an, prüfen Sie Ihre Verbindung und ob der Server erreichbar ist."
  fr: "L'envoi de vos modifications sur %{drive} échoue à répétition. Elles restent sur cet ordinateur et sont retentées automatiquement ; si cela dure, vérifiez votre connexion et que le serveur est joignable."
  es: "La subida de sus cambios en %{drive} falla una y otra vez. Se quedan en este equipo y se reintentan automáticamente; si persiste, compruebe su conexión y que el servidor esté accesible."
  ko: "%{drive}의 변경 사항 업로드가 계속 실패합니다. 변경 사항은 이 컴퓨터에 보관되며 자동으로 다시 시도됩니다. 계속되면 연결 상태와 서버 접속 가능 여부를 확인하세요."
  ru: "Изменения на %{drive} раз за разом не удаётся отправить. Они остаются на этом компьютере и отправляются повторно автоматически; если это продолжается, проверьте подключение и доступность сервера."
  pl: "Wysyłanie zmian na %{drive} wciąż się nie udaje. Pozostają na tym komputerze i są ponawiane automatycznie; jeśli to trwa, sprawdź połączenie i dostępność serwera."
  it: "Il caricamento delle modifiche su %{drive} continua a non riuscire. Restano su questo computer e vengono ritentate automaticamente; se persiste, controlla la connessione e che il server sia raggiungibile."
conflictCopySaved:
  en-US: "The other version was kept as %{copy}."
  zh-CN: "另一个版本已保存为 %{copy}。"
  zh-TW: "另一個版本已保存為 %{copy}。"
  ja: "もう一方のバージョンは %{copy} として保存されました。"
  de: "Die andere Version wurde als %{copy} behalten."
  fr: "L'autre version a été conservée sous %{copy}."
  es: "La otra versión se guardó como %{copy}."
  ko: "다른 버전은 %{copy}(으)로 보관되었습니다."
  ru: "Другая версия сохранена как %{copy}."
  pl: "Druga wersja została zachowana jako %{copy}."
  it: "L'altra versione è stata conservata come %{copy}."
lowDiskSpaceTitle:
  en-US: "Not enough disk space"
  zh-CN: "磁盘空间不足"
  zh-TW: "磁碟空間不足"
  ja: "ディスクの空き容量が不足しています"
  de: "Nicht genügend Speicherplatz"
  fr: "Espace disque insuffisant"
  es: "No hay suficiente espacio en disco"
  ko: "디스크 공간 부족"
  ru: "Недостаточно места на диске"
  pl: "Za mało miejsca na dysku"
  it: "Spazio su disco insufficiente"
lowDiskSpaceMessage:
  en-US: "%{drive} needs %{required} but only %{available} is available on this volume. Some files will not be downloaded."
  zh-CN: "%{drive} 需要 %{required}，但此卷仅有 %{available} 可用。部分文件将不会下载。"
  zh-TW: "%{drive} 需要 %{required}，但此磁碟區僅有 %{available} 可用。部分檔案將不會下載。"
  ja: "%{drive} には %{required} が必要ですが、このボリュームの空きは %{available} しかありません。一部のファイルはダウンロードされません。"
  de: "%{drive} benötigt %{required}, auf diesem Volume sind aber nur %{available} frei. Einige Dateien werden nicht heruntergeladen."
  fr: "%{drive} a besoin de %{required} mais seulement %{available} sont disponibles sur ce volume. Certains fichiers ne seront pas téléchargés."
  es: "%{drive} necesita %{required}, pero solo hay %{available} disponibles en este volumen. Algunos archivos no se descargarán."
  ko: "%{drive}에 %{required}이(가) 필요하지만 이 볼륨에는 %{available}만 사용할 수 있습니다. 일부 파일은 다운로드되지 않습니다."
  ru: "%{drive} требуется %{required}, но на этом томе доступно только %{available}. Некоторые файлы не будут загружены."
  pl: "%{drive} potrzebuje %{required}, ale na tym woluminie dostępne jest tylko %{available}. Niektóre pliki nie zostaną pobrane."
  it: "%{drive} richiede %{required} ma su questo volume sono disponibili solo %{available}. Alcuni file non verranno scaricati."
sidebarUpdateFailed:
  en-US: "Could not update the sidebar: %{error}"
  zh-CN: "无法更新侧边栏：%{error}"
  zh-TW: "無法更新側邊欄：%{error}"
  ja: "サイドバーを更新できませんでした: %{error}"
  de: "Die Seitenleiste konnte nicht aktualisiert werden: %{error}"
  fr: "Impossible de mettre à jour la barre latérale : %{error}"
  es: "No se pudo actualizar la barra lateral: %{error}"
  ko: "사이드바를 업데이트할 수 없습니다: %{error}"
  ru: "Не удалось обновить боковую панель: %{error}"
  pl: "Nie udało się zaktualizować paska bocznego: %{error}"
  it: "Impossibile aggiornare la barra laterale: %{error}"
mountFailedTitle:
  en-US: "Couldn't open \"%{drive}\""
  zh-CN: "无法打开“%{drive}”"
  zh-TW: "無法開啟「%{drive}」"
  ja: "「%{drive}」を開けませんでした"
  de: "\"%{drive}\" konnte nicht geöffnet werden"
  fr: "Impossible d'ouvrir « %{drive} »"
  es: "No se pudo abrir \"%{drive}\""
  ko: "\"%{drive}\"을(를) 열 수 없습니다"
  ru: "Не удалось открыть «%{drive}»"
  pl: "Nie można otworzyć „%{drive}”"
  it: "Impossibile aprire \"%{drive}\""
mountErrorFolderNotEmpty:
  en-US: "The folder %{folder} already contains files. Files on demand needs an empty folder: move its contents somewhere else (or choose another folder), then click Retry."
  zh-CN: "文件夹 %{folder} 中已有文件。按需文件需要一个空文件夹：请将其中的内容移到别处（或选择其他文件夹），然后点击“重试”。"
  zh-TW: "資料夾 %{folder} 中已有檔案。隨選檔案需要一個空資料夾：請將其中的內容移到別處（或選擇其他資料夾），然後點選「重試」。"
  ja: "フォルダー %{folder} にはすでにファイルがあります。オンデマンドファイルには空のフォルダーが必要です。中身を別の場所へ移動する（または別のフォルダーを選ぶ）と、「再試行」をクリックしてください。"
  de: "Der Ordner %{folder} enthält bereits Dateien. Dateien bei Bedarf brauchen einen leeren Ordner: Verschieben Sie den Inhalt an einen anderen Ort (oder wählen Sie einen anderen Ordner) und klicken Sie dann auf „Erneut versuchen“."
  fr: "Le dossier %{folder} contient déjà des fichiers. Les fichiers à la demande ont besoin d'un dossier vide : déplacez son contenu ailleurs (ou choisissez un autre dossier), puis cliquez sur « Réessayer »."
  es: "La carpeta %{folder} ya contiene archivos. Los archivos bajo demanda necesitan una carpeta vacía: mueve su contenido a otro sitio (o elige otra carpeta) y pulsa \"Reintentar\"."
  ko: "%{folder} 폴더에 이미 파일이 있습니다. 온디맨드 파일에는 빈 폴더가 필요합니다. 내용을 다른 곳으로 옮기거나 다른 폴더를 선택한 다음 \"다시 시도\"를 클릭하세요."
  ru: "В папке %{folder} уже есть файлы. Для файлов по запросу нужна пустая папка: перенесите её содержимое в другое место (или выберите другую папку) и нажмите «Повторить»."
  pl: "Folder %{folder} zawiera już pliki. Pliki na żądanie wymagają pustego folderu: przenieś jego zawartość w inne miejsce (lub wybierz inny folder), a następnie kliknij „Ponów”."
  it: "La cartella %{folder} contiene già dei file. I file su richiesta richiedono una cartella vuota: sposta il contenuto altrove (o scegli un'altra cartella), poi fai clic su \"Riprova\"."
mountErrorFuseMissing:
  en-US: "Files on demand needs FUSE, which is not installed on this computer. Install the \"fuse3\" package (Ubuntu/Debian: sudo apt install fuse3 · Fedora: sudo dnf install fuse3 · Arch: sudo pacman -S fuse3), then click Retry."
  zh-CN: "按需文件需要 FUSE，但此电脑未安装。请安装“fuse3”软件包（Ubuntu/Debian：sudo apt install fuse3 · Fedora：sudo dnf install fuse3 · Arch：sudo pacman -S fuse3），然后点击“重试”。"
  zh-TW: "隨選檔案需要 FUSE，但這台電腦未安裝。請安裝「fuse3」套件（Ubuntu/Debian：sudo apt install fuse3 · Fedora：sudo dnf install fuse3 · Arch：sudo pacman -S fuse3），然後點選「重試」。"
  ja: "オンデマンドファイルには FUSE が必要ですが、このコンピューターにはインストールされていません。「fuse3」パッケージをインストールしてから（Ubuntu/Debian: sudo apt install fuse3 · Fedora: sudo dnf install fuse3 · Arch: sudo pacman -S fuse3）、「再試行」をクリックしてください。"
  de: "Dateien bei Bedarf benötigen FUSE, das auf diesem Computer nicht installiert ist. Installieren Sie das Paket „fuse3“ (Ubuntu/Debian: sudo apt install fuse3 · Fedora: sudo dnf install fuse3 · Arch: sudo pacman -S fuse3) und klicken Sie dann auf „Erneut versuchen“."
  fr: "Les fichiers à la demande ont besoin de FUSE, qui n'est pas installé sur cet ordinateur. Installez le paquet « fuse3 » (Ubuntu/Debian : sudo apt install fuse3 · Fedora : sudo dnf install fuse3 · Arch : sudo pacman -S fuse3), puis cliquez sur « Réessayer »."
  es: "Los archivos bajo demanda necesitan FUSE, que no está instalado en este equipo. Instala el paquete \"fuse3\" (Ubuntu/Debian: sudo apt install fuse3 · Fedora: sudo dnf install fuse3 · Arch: sudo pacman -S fuse3) y pulsa \"Reintentar\"."
  ko: "온디맨드 파일에는 FUSE가 필요하지만 이 컴퓨터에 설치되어 있지 않습니다. \"fuse3\" 패키지를 설치한 다음(Ubuntu/Debian: sudo apt install fuse3 · Fedora: sudo dnf install fuse3 · Arch: sudo pacman -S fuse3) \"다시 시도\"를 클릭하세요."
  ru: "Для файлов по запросу нужен FUSE, который не установлен на этом компьютере. Установите пакет «fuse3» (Ubuntu/Debian: sudo apt install fuse3 · Fedora: sudo dnf install fuse3 · Arch: sudo pacman -S fuse3) и нажмите «Повторить»."
  pl: "Pliki na żądanie wymagają FUSE, którego nie zainstalowano na tym komputerze. Zainstaluj pakiet „fuse3” (Ubuntu/Debian: sudo apt install fuse3 · Fedora: sudo dnf install fuse3 · Arch: sudo pacman -S fuse3), a następnie kliknij „Ponów”."
  it: "I file su richiesta richiedono FUSE, che non è installato su questo computer. Installa il pacchetto \"fuse3\" (Ubuntu/Debian: sudo apt install fuse3 · Fedora: sudo dnf install fuse3 · Arch: sudo pacman -S fuse3), poi fai clic su \"Riprova\"."
mountErrorPermissionMac:
  en-US: "macOS blocked Cloudreve from opening %{folder}. Open System Settings › Privacy & Security › Files and Folders, allow Cloudreve to access \"Network Volumes\", then click Retry."
  zh-CN: "macOS 阻止了 Cloudreve 打开 %{folder}。请打开“系统设置 › 隐私与安全性 › 文件和文件夹”，允许 Cloudreve 访问“网络宗卷”，然后点击“重试”。"
  zh-TW: "macOS 阻擋了 Cloudreve 開啟 %{folder}。請打開「系統設定 › 隱私權與安全性 › 檔案與資料夾」，允許 Cloudreve 取用「網路卷宗」，然後點選「重試」。"
  ja: "macOS により Cloudreve が %{folder} を開けませんでした。「システム設定 › プライバシーとセキュリティ › ファイルとフォルダ」を開き、Cloudreve に「ネットワークボリューム」へのアクセスを許可してから、「再試行」をクリックしてください。"
  de: "macOS hat Cloudreve das Öffnen von %{folder} verweigert. Öffnen Sie Systemeinstellungen › Datenschutz & Sicherheit › Dateien und Ordner, erlauben Sie Cloudreve den Zugriff auf „Netzwerkvolumes“ und klicken Sie dann auf „Erneut versuchen“."
  fr: "macOS a empêché Cloudreve d'ouvrir %{folder}. Ouvrez Réglages Système › Confidentialité et sécurité › Fichiers et dossiers, autorisez Cloudreve à accéder aux « Volumes réseau », puis cliquez sur « Réessayer »."
  es: "macOS impidió que Cloudreve abriera %{folder}. Abre Ajustes del Sistema › Privacidad y seguridad › Archivos y carpetas, permite que Cloudreve acceda a \"Volúmenes de red\" y pulsa \"Reintentar\"."
  ko: "macOS가 Cloudreve의 %{folder} 열기를 차단했습니다. 시스템 설정 › 개인정보 보호 및 보안 › 파일 및 폴더에서 Cloudreve의 \"네트워크 볼륨\" 접근을 허용한 다음 \"다시 시도\"를 클릭하세요."
  ru: "macOS не позволила Cloudreve открыть %{folder}. Откройте «Системные настройки › Конфиденциальность и безопасность › Файлы и папки», разрешите Cloudreve доступ к «Сетевым томам» и нажмите «Повторить»."
  pl: "macOS zablokował Cloudreve dostęp do %{folder}. Otwórz Ustawienia systemowe › Prywatność i ochrona › Pliki i foldery, zezwól Cloudreve na dostęp do „Woluminów sieciowych”, a następnie kliknij „Ponów”."
  it: "macOS ha impedito a Cloudreve di aprire %{folder}. Apri Impostazioni di Sistema › Privacy e sicurezza › File e cartelle, consenti a Cloudreve l'accesso ai \"Volumi di rete\", poi fai clic su \"Riprova\"."
mountErrorPermission:
  en-US: "The system refused to open the drive in %{folder}. Make sure this folder belongs to you (or choose a folder inside your home folder), then click Retry."
  zh-CN: "系统拒绝在 %{folder} 中打开云盘。请确认该文件夹属于你（或选择你主目录中的文件夹），然后点击“重试”。"
  zh-TW: "系統拒絕在 %{folder} 中開啟雲端硬碟。請確認此資料夾屬於你（或選擇你家目錄中的資料夾），然後點選「重試」。"
  ja: "システムが %{folder} でドライブを開くことを拒否しました。このフォルダーがあなたのものであることを確認する（またはホームフォルダー内のフォルダーを選ぶ）と、「再試行」をクリックしてください。"
  de: "Das System hat das Öffnen des Laufwerks in %{folder} verweigert. Stellen Sie sicher, dass Ihnen dieser Ordner gehört (oder wählen Sie einen Ordner in Ihrem Benutzerordner), und klicken Sie dann auf „Erneut versuchen“."
  fr: "Le système a refusé d'ouvrir le disque dans %{folder}. Vérifiez que ce dossier vous appartient (ou choisissez un dossier dans votre dossier personnel), puis cliquez sur « Réessayer »."
  es: "El sistema se negó a abrir la unidad en %{folder}. Asegúrate de que esta carpeta te pertenece (o elige una carpeta dentro de tu carpeta personal) y pulsa \"Reintentar\"."
  ko: "시스템이 %{folder}에서 드라이브를 여는 것을 거부했습니다. 이 폴더가 본인 소유인지 확인하거나 홈 폴더 안의 폴더를 선택한 다음 \"다시 시도\"를 클릭하세요."
  ru: "Система не позволила открыть диск в %{folder}. Убедитесь, что эта папка принадлежит вам (или выберите папку внутри домашней папки), и нажмите «Повторить»."
  pl: "System odmówił otwarcia dysku w %{folder}. Upewnij się, że ten folder należy do ciebie (lub wybierz folder w swoim folderze domowym), a następnie kliknij „Ponów”."
  it: "Il sistema ha rifiutato di aprire l'unità in %{folder}. Assicurati che la cartella ti appartenga (o scegli una cartella nella tua cartella personale), poi fai clic su \"Riprova\"."
mountErrorStale:
  en-US: "The folder %{folder} is still held by an earlier Cloudreve session that did not close properly. Close any window or terminal open in that folder, then click Retry. If it keeps happening, restart your computer."
  zh-CN: "文件夹 %{folder} 仍被之前未正常关闭的 Cloudreve 会话占用。请关闭在该文件夹中打开的所有窗口或终端，然后点击“重试”。如果问题仍然存在，请重启电脑。"
  zh-TW: "資料夾 %{folder} 仍被先前未正常關閉的 Cloudreve 工作階段占用。請關閉在該資料夾中開啟的所有視窗或終端機，然後點選「重試」。若問題持續，請重新啟動電腦。"
  ja: "フォルダー %{folder} は、正しく終了しなかった以前の Cloudreve セッションがまだ使用しています。そのフォルダーで開いているウィンドウやターミナルを閉じてから、「再試行」をクリックしてください。繰り返し起きる場合は、コンピューターを再起動してください。"
  de: "Der Ordner %{folder} wird noch von einer früheren Cloudreve-Sitzung belegt, die nicht richtig beendet wurde. Schließen Sie alle Fenster oder Terminals, die in diesem Ordner geöffnet sind, und klicken Sie dann auf „Erneut versuchen“. Wenn das wiederholt passiert, starten Sie den Computer neu."
  fr: "Le dossier %{folder} est encore occupé par une session précédente de Cloudreve qui ne s'est pas fermée correctement. Fermez toute fenêtre ou tout terminal ouvert dans ce dossier, puis cliquez sur « Réessayer ». Si cela se reproduit, redémarrez l'ordinateur."
  es: "La carpeta %{folder} sigue ocupada por una sesión anterior de Cloudreve que no se cerró bien. Cierra cualquier ventana o terminal abierta en esa carpeta y pulsa \"Reintentar\". Si vuelve a pasar, reinicia el equipo."
  ko: "%{folder} 폴더를 제대로 종료되지 않은 이전 Cloudreve 세션이 아직 사용 중입니다. 해당 폴더에서 열린 창이나 터미널을 모두 닫은 다음 \"다시 시도\"를 클릭하세요. 계속 발생하면 컴퓨터를 다시 시작하세요."
  ru: "Папка %{folder} всё ещё занята предыдущим сеансом Cloudreve, который не завершился корректно. Закройте все окна и терминалы, открытые в этой папке, и нажмите «Повторить». Если это повторяется, перезагрузите компьютер."
  pl: "Folder %{folder} jest nadal zajęty przez wcześniejszą sesję Cloudreve, która nie zamknęła się poprawnie. Zamknij wszystkie okna i terminale otwarte w tym folderze, a następnie kliknij „Ponów”. Jeśli to się powtarza, uruchom ponownie komputer."
  it: "La cartella %{folder} è ancora occupata da una sessione precedente di Cloudreve che non si è chiusa correttamente. Chiudi ogni finestra o terminale aperto in quella cartella, poi fai clic su \"Riprova\". Se succede di nuovo, riavvia il computer."
mountErrorOther:
  en-US: "Cloudreve could not open the drive in %{folder}. Click Retry. If it keeps failing, the details are in the log files (~/.cloudreve/logs, Settings › Open log folder)."
  zh-CN: "Cloudreve 无法在 %{folder} 中打开云盘。请点击“重试”。如果仍然失败，详细信息见日志文件（~/.cloudreve/logs，设置 › 打开日志文件夹）。"
  zh-TW: "Cloudreve 無法在 %{folder} 中開啟雲端硬碟。請點選「重試」。若仍失敗，詳細資訊在記錄檔中（~/.cloudreve/logs，設定 › 開啟記錄資料夾）。"
  ja: "Cloudreve は %{folder} でドライブを開けませんでした。「再試行」をクリックしてください。失敗が続く場合、詳細はログファイル（~/.cloudreve/logs、設定 › ログフォルダーを開く）にあります。"
  de: "Cloudreve konnte das Laufwerk in %{folder} nicht öffnen. Klicken Sie auf „Erneut versuchen“. Wenn es weiterhin fehlschlägt, finden Sie Details in den Protokolldateien (~/.cloudreve/logs, Einstellungen › Protokollordner öffnen)."
  fr: "Cloudreve n'a pas pu ouvrir le disque dans %{folder}. Cliquez sur « Réessayer ». Si l'échec persiste, les détails sont dans les journaux (~/.cloudreve/logs, Paramètres › Ouvrir le dossier des journaux)."
  es: "Cloudreve no pudo abrir la unidad en %{folder}. Pulsa \"Reintentar\". Si sigue fallando, los detalles están en los registros (~/.cloudreve/logs, Ajustes › Abrir carpeta de registros)."
  ko: "Cloudreve가 %{folder}에서 드라이브를 열 수 없습니다. \"다시 시도\"를 클릭하세요. 계속 실패하면 로그 파일(~/.cloudreve/logs, 설정 › 로그 폴더 열기)에서 자세한 내용을 확인하세요."
  ru: "Cloudreve не удалось открыть диск в %{folder}. Нажмите «Повторить». Если ошибка повторяется, подробности есть в журналах (~/.cloudreve/logs, Настройки › Открыть папку журналов)."
  pl: "Cloudreve nie mógł otworzyć dysku w %{folder}. Kliknij „Ponów”. Jeśli błąd się powtarza, szczegóły znajdziesz w dziennikach (~/.cloudreve/logs, Ustawienia › Otwórz folder dzienników)."
  it: "Cloudreve non è riuscito ad aprire l'unità in %{folder}. Fai clic su \"Riprova\". Se continua a non funzionare, i dettagli sono nei file di log (~/.cloudreve/logs, Impostazioni › Apri cartella dei log)."
