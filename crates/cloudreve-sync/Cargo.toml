[package]
name = "cloudreve-sync"
version.workspace = true
edition = "2024"

[dependencies]
libc = "0.2"
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio-stream = { version = "0.1", features = ["sync"] }
dirs = "5.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
sha2 = "0.10"
image = "0.24"
url = "2.5"
cloudreve-api = { path = "../cloudreve-api" }
cloudreve-uploader = { path = "../cloudreve-uploader" }
cloudreve-vfs = { path = "../cloudreve-vfs" }
chrono = "0.4.42"
diesel = { version = "2.1", features = ["sqlite", "r2d2"] }
diesel_migrations = { version = "2.1", features = ["sqlite"] }
libsqlite3-sys = { version = "0.28", features = ["bundled"] }
open = "5.3.2"
rust-i18n = "3"
dark-light = "2.0.0"
bytes = "1"
notify-debouncer-full = "0.6.0"
dashmap = "5"
thiserror = "2.0"
tokio-util = { version = "0.7" }
globset = "0.4"
fs4 = { version = "1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSString", "NSDistributedNotificationCenter", "NSNotification", "NSDictionary"] }
cloudreve-finder-sync = { path = "../cloudreve-finder-sync" }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSImage"] }
libc = "0.2"

[dependencies.uuid]
version = "1.6"
features = ["v4", "serde"]

[dev-dependencies]
tempfile = "3.8"
wiremock = "0.6"
filetime = "0.2"
log = "0.4"

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSError", "NSGeometry", "objc2-core-foundation"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics", "NSGraphicsContext", "objc2-core-foundation"] }
