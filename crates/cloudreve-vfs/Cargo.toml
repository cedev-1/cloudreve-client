[package]
name = "cloudreve-vfs"
version.workspace = true
edition = "2021"

[dependencies]
cloudreve-api = { path = "../cloudreve-api" }
tokio = { version = "1.35", features = ["full"] }
anyhow = "1.0"
tracing = "0.1"
reqwest = { version = "0.12", features = ["stream"] }
bytes = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4.42"
sha2 = "0.10"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3.8"
uuid = { version = "1.6", features = ["v4"] }
cloudreve-uploader = { path = "../cloudreve-uploader" }
