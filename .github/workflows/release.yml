name: Release

# One workflow for every release. Whether a tag is a prerelease is derived from
# the tag itself (semver: anything with a `-` suffix), so a beta can never be
# published as the "latest" release that the auto-updater points at.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build, e.g. v0.2.0-beta.1'
        required: true

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve release metadata
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Semver: a prerelease is anything carrying a `-` suffix (-alpha, -beta,
          # -rc). GitHub excludes prereleases from `releases/latest`, which is the
          # URL the updater polls, so this flag is what keeps stable users off betas.
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --latest
        env:
          OUTPUT: /tmp/release-notes.md
          GITHUB_REPO: ${{ github.repository }}

      # Appended here rather than through the action's `body` + `append_body`:
      # when the release is created fresh, `body_path` wins and `body` is dropped
      # silently — which is why no release so far has ever shown these notes.
      - name: Append installation notes
        run: |
          cat >> /tmp/release-notes.md <<'EOF'

          ---

          ### Installation (macOS, Apple Silicon)
          1. Download the `.dmg` and drag Cloudreve to Applications
          2. **First launch**: right-click -> Open -> Run `xattr -cr /Applications/Cloudreve.app`

          ### Installation (Linux, x86_64)
          - `.AppImage`: `chmod +x Cloudreve*.AppImage && ./Cloudreve*.AppImage`
            This is the only Linux format that can auto-update itself.
          - `.deb`: `sudo dpkg -i *.deb` — updates must be installed manually.
          EOF

      - name: Create GitHub Release
        id: create
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: 'Cloudreve Desktop ${{ steps.meta.outputs.tag }}'
          prerelease: ${{ steps.meta.outputs.prerelease }}
          draft: false
          body_path: /tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest   # Apple Silicon (arm64)
            args: '--target aarch64-apple-darwin'
            target: aarch64-apple-darwin
          - platform: ubuntu-22.04   # Linux x86_64
            args: ''
            target: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      - name: Install Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '20'

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2.9.1
        with:
          workspaces: '. -> target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config

      - name: Set app version from tag
        run: |
          VERSION="${{ needs.create-release.outputs.tag }}"
          VERSION="${VERSION#v}"
          # Two sources to patch: the bundle version shown to users and compared by
          # the updater, and the crate version that `CARGO_PKG_VERSION` bakes into
          # the User-Agent sent to every Cloudreve server.
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > tmp.json
          mv tmp.json src-tauri/tauri.conf.json
          sed -i.bak -E "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          rm Cargo.toml.bak
          grep -q "^version = \"$VERSION\"$" Cargo.toml

      - name: Install frontend dependencies
        working-directory: ui
        run: yarn install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}
