name: CI

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'src-tauri/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'ui/**'
      - 'locales/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'src-tauri/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'ui/**'
      - 'locales/**'
      - '.github/workflows/ci.yml'

jobs:
  frontend:
    name: Frontend type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '20'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Type-check
        # Not a bare "tsc --noEmit": tsconfig.json only holds project
        # references ("files": []), so that checks nothing at all.
        run: |
          yarn tsc -p tsconfig.app.json --noEmit
          yarn tsc -p tsconfig.node.json --noEmit

  test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2.9.1
        with:
          workspaces: '. -> target'

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config \
            fuse3

      - name: Check FUSE is available
        run: |
          test -e /dev/fuse
          fusermount3 --version

      - name: Run tests
        run: cargo test -p cloudreve-sync -p cloudreve-api -p cloudreve-uploader -p cloudreve-vfs

      - name: Desktop crate (Tauri commands)
        # tauri-build requires the frontendDist directory to exist, but the
        # Rust side (and the JSON the UI reads) needs no real frontend build.
        run: |
          mkdir -p ui/dist
          cargo test -p cloudreve-desktop --lib

  test-macos:
    name: Rust tests (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2.9.1
        with:
          workspaces: '. -> target'

      - name: Show macOS version
        run: sw_vers

      - name: Icon probe (temporary experiment)
        continue-on-error: true
        run: cargo test -p cloudreve-sync --test icon_probe_tmp -- --ignored --nocapture probe_icons

      - name: Root xattr probe (temporary experiment)
        continue-on-error: true
        run: cargo test -p cloudreve-vfs --test root_xattr_probe_tmp -- --nocapture

      - name: Run tests
        run: cargo test -p cloudreve-vfs

      - name: What Foundation answers on the drive (safe save, trash, tags)
        # Already run above; again with --nocapture so the log records each
        # answer, not just the verdict.
        run: cargo test -p cloudreve-vfs --test mounted_macos_apps -- --nocapture

      - name: Finder sidebar (real LSSharedFileList and NSWorkspace)
        # Edits the runner's Finder Favorites, so it is #[ignore]d for local runs.
        run: |
          cargo test -p cloudreve-sync --lib sidebar
          cargo test -p cloudreve-sync --test drive_sidebar
          # --nocapture: the E2E checkpoints locate a native crash, which
          # prints no panic message.
          RUST_BACKTRACE=1 cargo test -p cloudreve-sync --test finder_sidebar_macos -- --ignored --nocapture --test-threads=1
