name: CI

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'src-tauri/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'ui/**'
      - 'locales/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'src-tauri/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'ui/**'
      - 'locales/**'
      - '.github/workflows/ci.yml'

jobs:
  frontend:
    name: Frontend type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '20'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Type-check
        # Not a bare "tsc --noEmit": tsconfig.json only holds project
        # references ("files": []), so that checks nothing at all.
        run: |
          yarn tsc -p tsconfig.app.json --noEmit
          yarn tsc -p tsconfig.node.json --noEmit

  test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2.9.1
        with:
          workspaces: '. -> target'

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config \
            fuse3

      - name: Check FUSE is available
        run: |
          test -e /dev/fuse
          fusermount3 --version

      - name: Run tests
        run: cargo test -p cloudreve-sync -p cloudreve-api -p cloudreve-uploader -p cloudreve-vfs

      - name: Desktop crate (Tauri commands)
        # tauri-build requires the frontendDist directory to exist, but the
        # Rust side (and the JSON the UI reads) needs no real frontend build.
        run: |
          mkdir -p ui/dist
          cargo test -p cloudreve-desktop --lib

  test-macos:
    name: Rust tests (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2.9.1
        with:
          workspaces: '. -> target'

      - name: Show macOS version
        run: sw_vers

      - name: Run tests
        run: cargo test -p cloudreve-vfs

      - name: What Foundation answers on the drive (safe save, trash, tags)
        # Already run above; again with --nocapture so the log records each
        # answer, not just the verdict.
        run: cargo test -p cloudreve-vfs --test mounted_macos_apps -- --nocapture

      - name: Finder sidebar (real LSSharedFileList and NSWorkspace)
        # Edits the runner's Finder Favorites, so it is #[ignore]d for local runs;
        # --include-ignored also runs the tests that never touch the sidebar.
        run: |
          cargo test -p cloudreve-sync --lib sidebar
          cargo test -p cloudreve-sync --test drive_sidebar
          # --nocapture: the E2E checkpoints locate a native crash, which
          # prints no panic message.
          RUST_BACKTRACE=1 cargo test -p cloudreve-sync --test finder_sidebar_macos -- --include-ignored --nocapture --test-threads=1

      - name: Mutations of the drive icon fix (temporary)
        continue-on-error: true
        run: |
          T=an_on_demand_drive_folder_resolves_to_the_cloudreve_logo_even_once_finder_listed_it
          run() {
            echo "=== MUTATION $1"
            eval "$2"
            git diff --stat
            cargo test -q -p cloudreve-sync --test finder_sidebar_macos -- --ignored --exact $T --test-threads=1 2>&1 | grep -E "RESOLVED|test result" || true
            cargo test -q -p cloudreve-vfs --test mounted_macos the_mount_root_finder_info 2>&1 | grep -E "panicked|assertion|test result" || true
            git checkout -- crates
          }
          run "baseline" "true"
          run "no seeding" "perl -pi -e 's/volume_root_files\(show_icon\) \{/volume_root_files(show_icon).into_iter().take(0) {/' crates/cloudreve-sync/src/drive/mounts.rs"
          run "root sidecar not listed" "perl -pi -e 's/if dir == self\.vfs\.tree\(\)\.root\(\) \{/if false \&\& dir == self.vfs.tree().root() {/' crates/cloudreve-vfs/src/nfs.rs"
          run "seeded without the custom-icon bit" "perl -pi -e 's/with_custom_icon\(\[0; 32\], icon\)/with_custom_icon([0; 32], false)/' crates/cloudreve-sync/src/sidebar/macos.rs"
