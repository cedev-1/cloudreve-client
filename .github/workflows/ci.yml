          echo "--- mutation: mount options without actimeo=1,nonegnamecache"
          VFS_TEST_MOUNT_OPTS="locallocks,mutejukebox,vers=3,tcp,soft,dumbtimer,timeo=30,retrans=2,nobrowse,rsize=1048576,wsize=1048576,readahead=4" cargo test -p cloudreve-vfs --test mounted_macos -- --nocapture remotely remote_change 2>&1 | grep -E "REMOTE-CHANGE-LATENCY|^test " || true
name: CI

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'src-tauri/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'src-tauri/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'

jobs:
  test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2.9.1
        with:
          workspaces: '. -> target'

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config \
            fuse3

      - name: Check FUSE is available
        run: |
          test -e /dev/fuse
          fusermount3 --version

      - name: Run tests
        run: cargo test -p cloudreve-sync -p cloudreve-api -p cloudreve-uploader -p cloudreve-vfs

      - name: Check desktop crate compiles
        # tauri-build requires the frontendDist directory to exist,
        # but type-checking the Rust code doesn't need a real frontend build
        # need to add ci for frontend part
        run: |
          mkdir -p ui/dist
          cargo check -p cloudreve-desktop

  test-macos:
    name: Rust tests (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2.9.1
        with:
          workspaces: '. -> target'

      - name: Show macOS version
        run: sw_vers

      - name: Run tests
        run: cargo test -p cloudreve-vfs

      - name: Measure remote-change latency and mount cost (temporary)
        if: always()
        run: |
          BASE="locallocks,mutejukebox,vers=3,tcp,soft,dumbtimer,timeo=30,retrans=2,nobrowse,rsize=1048576,wsize=1048576,readahead=4"
          cargo test -p cloudreve-vfs --test mounted_macos -- --nocapture remotely remote_change 2>&1 | grep -E "REMOTE-CHANGE-LATENCY|^test " || true
          echo "--- mutation: mount options without actimeo=1,nonegnamecache"
          VFS_TEST_MOUNT_OPTS="$BASE" cargo test -p cloudreve-vfs --test mounted_macos -- --nocapture remotely remote_change 2>&1 | grep -E "REMOTE-CHANGE-LATENCY|^test " || true
          echo "--- mutation: actimeo=1 without nonegnamecache"
          VFS_TEST_MOUNT_OPTS="$BASE,actimeo=1" cargo test -p cloudreve-vfs --test mounted_macos -- --nocapture remotely remote_change 2>&1 | grep -E "REMOTE-CHANGE-LATENCY|^test " || true
          cargo test -p cloudreve-vfs --test mounted_macos -- --ignored --nocapture measure_rpc_and_http_cost_of_mount_options 2>&1 | grep -E "MOUNT-COST|^test " || true
