  ring, a gap, then its coloured disc with the cloud biting into the bottom
  (the `_clip1` path of ui/src/assets/cloudreve.svg, scaled). The same
  glyph in the three weight columns; scaffold per SidebarFavorites'
  SymbolTemplateSynthesizer (every guide below is required by actool).
  Compiled into ../Assets.car by ../compile-symbol.sh.
-->
